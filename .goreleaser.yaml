# GoReleaser config — single-binary, multi-OS, sha256 checksums into dist/.
# goreleaser creates the GitHub Release with assets, so release.yml IS the
# uploader (publish_repo.sh skips upload when .goreleaser.yaml exists).
version: 2

project_name: dropdiff

before:
  hooks:
    - go mod tidy

builds:
  - id: dropdiff
    main: .
    binary: dropdiff
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/SuperMarioYL/dropdiff/cmd.Version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "merge conflict"

release:
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
