<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Architecture: Wired Config + Drop Registry flow into the DropDiff Differ, which emits red/green Config Deltas">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#F5F5F7"/>

  <!-- static base connectors (with arrowheads) -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="210" y1="185" x2="355" y2="185" marker-end="url(#ah-l)"/>
    <line x1="525" y1="185" x2="670" y2="185" marker-end="url(#ah-l)"/>
    <line x1="440" y1="88"  x2="440" y2="150" marker-end="url(#ah-l)"/>
  </g>

  <!-- marching-dash data flow (seamless: dasharray 16, offset 32->0 = 2 periods) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="185" x2="351" y2="185" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="525" y1="185" x2="666" y2="185" stroke="#5E5CE6" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="440" y1="88"  x2="440" y2="146" stroke="#0071E3" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- data packets along each connector -->
  <g>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M210,185 L351,185" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#5E5CE6">
      <animateMotion path="M525,185 L666,185" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#0071E3">
      <animateMotion path="M440,88 L440,146" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes (breathing fill-opacity 0.10<->0.18, staggered) -->
  <g>
    <rect x="40"  y="150" width="170" height="70" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">Wired Config</text>
    <text x="125" y="200" text-anchor="middle" font-size="10" fill="#6E6E73">claude.json · .env · aider</text>

    <rect x="355" y="150" width="170" height="70" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#4B3FC4">DropDiff Differ</text>
    <text x="440" y="200" text-anchor="middle" font-size="10" fill="#6E6E73">DropSpec × WiredConfig</text>

    <rect x="670" y="150" width="170" height="70" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#0B6B53">Config Deltas</text>
    <text x="755" y="200" text-anchor="middle" font-size="10" fill="#6E6E73">red / green</text>

    <rect x="355" y="30" width="170" height="58" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="56" text-anchor="middle" font-size="13" font-weight="600" fill="#0A4F9E">Drop Registry</text>
    <text x="440" y="74" text-anchor="middle" font-size="9" fill="#6E6E73">curated / synced</text>
  </g>
</svg>
